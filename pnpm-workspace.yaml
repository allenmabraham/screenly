packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  electron: false
  electron-winstaller: false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security patches for transitive build-time dependencies that upstream
# packages have not yet picked up. Keep each entry until `pnpm audit` is clean
# without it.
overrides:
  "baseline-browser-mapping@<2.11.0": ">=2.11.0"
  "brace-expansion@<1.1.21": ">=1.1.21 <2"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12"
  "browserslist@<4.28.7": ">=4.28.7"
  "esbuild@<=0.24.2": ">=0.25.0"
  "http-cache-semantics@<=4.2.0": ">=4.2.1 <5"
  "js-yaml@>=4.0.0 <4.3.2": ">=4.3.2 <5"
  "nanoid@<3.3.18": ">=3.3.18"
  "postcss@<8.5.23": ">=8.5.23"
  "source-map-js@<1.2.2": ">=1.2.2"
