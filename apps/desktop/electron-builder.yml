appId: com.screenly.recorder
productName: Screenly
copyright: Copyright © Screenly

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: Screenly-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Screenly
  uninstallDisplayName: Screenly
  runAfterFinish: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  executableName: screenly
  category: AudioVideo
  maintainer: Screenly
  vendor: Screenly
  synopsis: Screen recorder with instant share links
  description: >-
    Record your screen, a window, or an area with microphone, system audio,
    and a webcam bubble, then paste the share link before the upload finishes.
  desktop:
    entry:
      Name: Screenly
      Comment: Record your screen and share a link instantly
      StartupWMClass: Screenly

appImage:
  artifactName: Screenly-${version}-x86_64.${ext}

deb:
  packageName: screenly
  artifactName: screenly_${version}_amd64.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - pipewire-pulse | pulseaudio
    - libappindicator3-1
