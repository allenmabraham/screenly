# Pull request verification.
#
# `Deploy backend` only runs after a merge into main, so this workflow is the
# gate that keeps broken or vulnerable changes out of main in the first place.
# It runs the same checks as the deploy workflow plus a production dependency
# audit and both container image builds (without pushing them).

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm through Corepack
        run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on high or critical advisories against packages that ship to
      # production. Development-only tooling is reported but not blocking.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web and worker
        run: pnpm build

      - name: Bundle desktop recorder
        run: pnpm --filter @screenly/desktop build

      - name: Validate Compose configuration
        run: docker compose config --quiet

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          tags: screenly/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The images must at least start their entrypoint and report
      # configuration errors instead of crashing for an unrelated reason.
      - name: Smoke test web image
        if: matrix.image == 'web'
        run: |
          set -euo pipefail
          output=$(docker run --rm \
            -e DATABASE_URL=postgresql://screenly:secret@127.0.0.1:5432/screenly \
            -e SESSION_SECRET=replace-with-at-least-32-random-characters \
            -e STORAGE_ACCESS_KEY_ID=x -e STORAGE_SECRET_ACCESS_KEY=y -e STORAGE_BUCKET=b \
            screenly/web:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "APP_URL is required in production"
          echo "$output" | grep -q "SESSION_SECRET still contains a placeholder value"

      - name: Smoke test worker image
        if: matrix.image == 'worker'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint ffmpeg screenly/worker:ci -version | head -1
          output=$(docker run --rm screenly/worker:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -qi "DATABASE_URL"
